<section class="join-card">
  <div class="big-emoji" aria-hidden="true">👋</div>
  <h2 class="title">{{ title() }}</h2>
  @if (label()) {
    <p class="label">{{ label() }}</p>
  }
  @if (closeText()) {
    <p class="closing">Bài đóng lúc {{ closeText() }}</p>
  }

  <div class="field">
    <label class="field-label" for="player-name">Tên của bạn</label>
    <input #nameInput nz-input id="player-name" name="name" maxlength="40" autocomplete="off" autofocus
           [class.ant-input-status-error]="!!error()" [attr.aria-invalid]="!!error()"
           [attr.aria-describedby]="error() ? 'player-name-error' : null"
           [ngModel]="name()" (ngModelChange)="name.set($event ?? '')" (keydown.enter)="onEnter($event)"/>
    @if (error()) {
      <p id="player-name-error" class="error text-error" role="alert">{{ error() }}</p>
    }
  </div>

  <button nz-button nzType="primary" nzSize="large" type="button" class="join-button"
          [disabled]="trimmed() === '' || busy()" [nzLoading]="busy()" (click)="submit()">
    Vào chơi
  </button>
</section>
