<section class="join-card">
  <div class="hero">
    <app-player-avatar [avatar]="avatar()" [name]="trimmed()" size="xl"/>
  </div>
  <h2 class="title">{{ title() }}</h2>
  @if (label()) {
    <p class="label">{{ label() }}</p>
  }
  @if (closeText()) {
    <p class="closing">Bài đóng lúc {{ closeText() }}</p>
  }

  <div class="field">
    <label class="field-label" for="player-name">Tên của bạn</label>
    <input #nameInput (keydown.enter)="onEnter($event)" (ngModelChange)="name.set($event ?? '')" [attr.aria-describedby]="error() ? 'player-name-error' : null" [attr.aria-invalid]="!!error()" [class.ant-input-status-error]="!!error()" [ngModel]="name()"
           autocomplete="off" autofocus
           id="player-name"
           maxlength="40" name="name" nz-input/>
    @if (error()) {
      <p class="error text-error" id="player-name-error" role="alert">{{ error() }}</p>
    }
  </div>

  <div class="field">
    <span class="field-label">Chọn hình đại diện</span>
    <app-avatar-picker [(value)]="avatar"/>
  </div>

  <button (click)="submit()" [disabled]="trimmed() === '' || busy()" [nzLoading]="busy()" class="join-button" nz-button
          nzSize="large" nzType="primary" type="button">
    Vào chơi
  </button>
</section>
