<div class="board" [class.locked]="locked()" [class.revealed]="reveal() !== null">
  <p class="statement">{{ question().question }}</p>

  <div class="targets">
    @for (target of targets; track target.index) {
      <button
        type="button"
        class="target"
        [class.yes]="target.index === trueIndex"
        [class.no]="target.index !== trueIndex"
        [class.charging]="cameraActive() && view().choice === target.index"
        [class.picked]="picked() === target.index"
        [class.correct]="isCorrect(target.index)"
        [class.wrong]="isWrong(target.index)"
        (click)="onTarget(target.index, $event)">
        <kbd>{{ target.keys }}</kbd>
        @if (isCorrect(target.index)) {
          <b class="mark">✓</b>
        } @else if (isWrong(target.index)) {
          <b class="mark">✗</b>
        }
        <span class="symbol">
          @if (cameraActive()) {
            <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
              <circle class="track" cx="50" cy="50" r="46" pathLength="100" />
              <circle
                class="fill"
                cx="50"
                cy="50"
                r="46"
                pathLength="100"
                [attr.stroke-dashoffset]="offset(target.index)" />
            </svg>
          }
          <span class="emoji" aria-hidden="true">{{ target.emoji }}</span>
        </span>
        <span class="label">{{ target.label }}</span>
      </button>
    }
  </div>

  @if (cameraActive()) {
    <p class="status" [class.active]="view().choice !== null" [class.hidden]="locked()">
      {{ status() }}
    </p>
  }
</div>
