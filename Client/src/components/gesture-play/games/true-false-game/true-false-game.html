<div [class.locked]="locked()" [class.revealed]="reveal() !== null" class="board">
  <p class="statement">{{ question().question }}</p>

  <div class="targets">
    @for (target of targets; track target.index) {
      <button
        (click)="onTarget(target.index, $event)"
        [class.charging]="cameraActive() && view().choice === target.index"
        [class.correct]="isCorrect(target.index)"
        [class.no]="target.index !== trueIndex"
        [class.picked]="picked() === target.index"
        [class.wrong]="isWrong(target.index)"
        [class.yes]="target.index === trueIndex"
        class="target"
        type="button">
        <kbd>{{ target.keys }}</kbd>
        @if (isCorrect(target.index)) {
          <b class="mark">✓</b>
        } @else if (isWrong(target.index)) {
          <b class="mark">✗</b>
        }
        <span class="symbol">
          @if (cameraActive()) {
            <svg aria-hidden="true" class="ring" viewBox="0 0 100 100">
              <circle class="track" cx="50" cy="50" pathLength="100" r="46"/>
              <circle
                [attr.stroke-dashoffset]="offset(target.index)"
                class="fill"
                cx="50"
                cy="50"
                pathLength="100"
                r="46"/>
            </svg>
          }
          <span aria-hidden="true" class="emoji">{{ target.emoji }}</span>
        </span>
        <span class="label">{{ target.label }}</span>
      </button>
    }
  </div>

  @if (cameraActive()) {
    <p [class.active]="view().choice !== null" [class.hidden]="locked()" class="status">
      {{ status() }}
    </p>
  }
</div>
