<div #top class="top">
  <div #questionBox class="box question-box">
    <span class="fit">{{ question().question }}</span>
  </div>
  @for (option of answers(); track $index) {
    <div #answerBox [attr.data-slot]="$index" [class]="states()[$index]" class="box answer">
      <kbd aria-hidden="true">{{ $index + 1 }}</kbd>
      <span aria-hidden="true" class="fruit-icon">{{ fruitIcons[$index] }}</span>
      <span class="fit">{{ option }}</span>
    </div>
  }
</div>

<canvas #field (contextmenu)="$event.preventDefault()" aria-hidden="true" class="field"></canvas>

@if (hint()) {
  <p class="hint">{{ hint() }}</p>
}
