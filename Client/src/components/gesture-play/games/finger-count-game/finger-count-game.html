<div [class.locked]="locked()" [class.revealed]="reveal() !== null" class="board">
  <p class="question">{{ question().question }}</p>

  <div class="cards">
    @for (option of question().options; track $index) {
      @let number = $index + 1;
      <button
        (click)="onCard($index, $event)"
        [attr.aria-label]="number + ': ' + option"
        [attr.data-n]="number"
        [class.charging]="cameraActive() && view().choice === $index"
        [class.correct]="isCorrect($index)"
        [class.picked]="picked() === $index"
        [class.wrong]="isWrong($index)"
        class="card"
        type="button">
        @if (isCorrect($index)) {
          <b class="mark">✓</b>
        } @else if (isWrong($index)) {
          <b class="mark">✗</b>
        }
        <span class="head">
          <!-- The number as fingers: the first `number` fingers are up, the rest folded. -->
          <svg aria-hidden="true" class="hand" viewBox="0 0 44 44">
            @for (finger of fingers; track finger) {
              <rect
                [attr.height]="finger < number ? 26 : 12"
                [attr.x]="3 + finger * 10"
                [attr.y]="finger < number ? 2 : 16"
                [class.up]="finger < number"
                class="finger"
                rx="4"
                width="8"/>
            }
            <rect class="palm" height="20" rx="8" width="38" x="3" y="22"/>
          </svg>
          <span class="num">
            @if (cameraActive()) {
              <svg aria-hidden="true" class="ring" viewBox="0 0 100 100">
                <circle class="track" cx="50" cy="50" pathLength="100" r="46"/>
                <circle
                  [attr.stroke-dashoffset]="offset($index)"
                  class="fill"
                  cx="50"
                  cy="50"
                  pathLength="100"
                  r="46"/>
              </svg>
            }
            <span class="digit">{{ number }}</span>
          </span>
        </span>
        <span [class.han]="isHan(option)" class="text">{{ option }}</span>
      </button>
    }
  </div>

  @if (cameraActive()) {
    <div [class.hidden]="locked()" class="status">
      <b [class.seen]="view().count >= 0" class="badge">{{ badge() }}</b>
      <span class="hint">{{ status() }}</span>
    </div>
  }
</div>
