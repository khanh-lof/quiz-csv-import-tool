<div [class.cam]="cameraActive()" [class.locked]="locked()" class="frame">
  <div class="question">
    <p>{{ question().question }}</p>
  </div>

  <div class="lanes">
    @for (slot of lanes(); track slot.index) {
      <div
        [class.here]="frogLane() === slot.index"
        [class.ready]="armedLane() === slot.index"
        class="lane">
        @if (slot.filled) {
          <button
            (click)="pick(slot.index)"
            [class.correct]="isCorrect(slot.index)"
            [class.picked]="picked() === slot.index"
            [class.wrong]="isWrong(slot.index)"
            class="card"
            type="button">
            <span class="chip"><kbd>{{ slot.index + 1 }}</kbd></span>
            @if (reveal() === null) {
              <span aria-hidden="true" class="fly">🪰</span>
            }
            <span [class]="slot.size" class="word">{{ slot.main }}</span>
            @if (slot.note) {
              <span class="note">{{ slot.note }}</span>
            }
            @if (isCorrect(slot.index)) {
              <b class="mark">✓</b>
            } @else if (isWrong(slot.index)) {
              <b class="mark">✗</b>
            }
          </button>
        }
        <div class="track">
          @if (picked() === slot.index) {
            <i class="tongue"></i>
          }
        </div>
      </div>
    }

    <div
      [class.bite]="picked() !== null"
      [style.left.%]="frogLeft()"
      aria-hidden="true"
      class="frog">
      <svg class="frog-svg" viewBox="0 0 120 100">
        <ellipse class="dark" cx="18" cy="86" rx="16" ry="11"/>
        <ellipse class="dark" cx="102" cy="86" rx="16" ry="11"/>
        <ellipse class="skin" cx="60" cy="68" rx="48" ry="30"/>
        <circle class="skin" cx="34" cy="36" r="17"/>
        <circle class="skin" cx="86" cy="36" r="17"/>
        <circle cx="34" cy="36" fill="#fff" r="11"/>
        <circle cx="86" cy="36" fill="#fff" r="11"/>
        <circle cx="35" cy="37" fill="#333" r="5.5"/>
        <circle cx="85" cy="37" fill="#333" r="5.5"/>
        <circle cx="24" cy="70" fill="#fb7185" opacity="0.45" r="7"/>
        <circle cx="96" cy="70" fill="#fb7185" opacity="0.45" r="7"/>
        <ellipse
          [attr.ry]="3 + 17 * frogMouth()"
          class="mouth"
          cx="60"
          cy="74"
          rx="24"/>
        @if (frogMouth() > 0.3) {
          <ellipse
            [attr.cy]="74 + 8 * frogMouth()"
            [attr.ry]="6 * frogMouth()"
            cx="60"
            fill="#fb7185"
            rx="12"/>
        }
      </svg>
    </div>
  </div>

  <div class="footer">
    @if (cameraActive()) {
      @if (ready()) {
        <div class="status" role="status">
          <div aria-hidden="true" class="mouth-meter">
            <span>😮</span>
            <div class="track-bar">
              <i [class.open]="mouthOpen()" [style.width.%]="mouthPercent()" class="fill"></i>
              <b [style.left.%]="biteMarkPercent" class="limit"></b>
            </div>
          </div>
          <p [class.warn]="problem()" class="hint">{{ hintText() }}</p>
        </div>
      }
      <app-face-calibration
        (recalibrate)="recalibrate()"
        [calibrating]="!ready()"
        [progress]="calibrationProgress()"
        [status]="calibrationStatus()"/>
    } @else {
      <p class="status hint">Bấm vào đáp án hoặc nhấn 1 / 2 / 3 (← ↓ → dời ếch, Space để đớp)</p>
    }
  </div>
</div>
