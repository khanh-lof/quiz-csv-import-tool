<section class="map">
  @if (allPassed()) {
    <div class="celebration" role="status">
      <div class="trophy" aria-hidden="true">🏆</div>
      <h2>Chúc mừng! Bạn đã qua tất cả các màn</h2>
      <p>Tổng điểm tốt nhất: <b>{{ totalScore() }}</b></p>
    </div>
  }

  <p class="summary">
    Quiz có <b>{{ total() }}</b> câu hỏi, chơi từ dễ đến khó. Mỗi màn cần đúng từ 70% số câu để mở màn sau.
  </p>

  <div class="stages">
    @for (card of cards(); track card.def.stage) {
      <button type="button" class="stage-card" [class]="'stage-card status-' + card.status"
              [disabled]="card.status === 'locked' || card.status === 'empty'"
              (click)="start.emit(card.def.stage)">
        <span class="card-top">
          <span class="stage-icon" aria-hidden="true">{{ card.def.icon }}</span>
          <span class="stage-title">
            <span class="stage-no">Màn {{ card.def.stage }}</span>
            <span class="stage-name">{{ card.def.name }}</span>
          </span>
          @switch (card.status) {
            @case ('passed') {
              <nz-tag nzColor="success">Đã qua ✓</nz-tag>
            }
            @case ('open') {
              <nz-tag nzColor="processing">Đang mở</nz-tag>
            }
            @case ('locked') {
              <nz-tag>Khóa 🔒</nz-tag>
            }
            @default {
              <nz-tag>Không có câu – bỏ qua</nz-tag>
            }
          }
        </span>
        <span class="stage-hint">{{ card.def.hint }}</span>
        <span class="card-foot">
          <span>{{ card.count }} câu</span>
          <span class="best">
            @if (card.best; as best) {
              Tốt nhất: <b>{{ best.correct }}/{{ best.total }}</b> · {{ best.correct * pointsPerCorrect }} điểm
            } @else if (card.status !== 'empty') {
              Chưa chơi
            }
          </span>
        </span>
      </button>
    }
  </div>

  <div class="settings">
    <div class="setting">
      <span class="setting-label">Thời gian mỗi câu</span>
      <nz-radio-group [ngModel]="settings().timeMode" (ngModelChange)="setTimeMode($event)"
                      nzButtonStyle="solid" nzSize="small">
        <label nz-radio-button nzValue="standard">Chuẩn</label>
        <label nz-radio-button nzValue="extra">Thêm giờ (×1,5)</label>
        <label nz-radio-button nzValue="unlimited">Không giới hạn</label>
      </nz-radio-group>
    </div>
    <div class="setting">
      <span class="setting-label">Âm thanh</span>
      <nz-switch [ngModel]="settings().sound" (ngModelChange)="setSound($event)"
                 nzCheckedChildren="Bật" nzUnCheckedChildren="Tắt"/>
    </div>
    <button nz-button nzDanger type="button" class="reset-button"
            nz-popconfirm nzPopconfirmTitle="Xóa tiến độ của quiz này và chơi lại từ đầu?"
            nzPopconfirmPlacement="top" nzOkText="Chơi lại" nzOkDanger nzCancelText="Thôi"
            (nzOnConfirm)="resetProgress()">
      <nz-icon nzType="reload" nzTheme="outline"/>
      Chơi lại từ đầu
    </button>
  </div>
</section>
