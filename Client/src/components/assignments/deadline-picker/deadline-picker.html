<nz-radio-group class="presets" [ngModel]="preset()" (ngModelChange)="setPreset($event)" nzButtonStyle="solid">
  <label nz-radio-button nzValue="none">Không hẹn giờ</label>
  <label nz-radio-button nzValue="45m">Sau 45 phút</label>
  <label nz-radio-button nzValue="today">Hết hôm nay</label>
  <label nz-radio-button nzValue="custom">Chọn giờ…</label>
</nz-radio-group>

@if (preset() === 'custom') {
  <nz-date-picker class="custom-time" aria-label="Giờ đóng bài" nzFormat="HH:mm dd/MM/yyyy"
                  [nzShowTime]="{nzFormat: 'HH:mm'}" [nzShowNow]="false" [nzAllowClear]="false"
                  nzPlaceHolder="Chọn ngày và giờ" [nzDisabledDate]="disabledDate" [nzDisabledTime]="disabledTime"
                  [ngModel]="customDate()" (ngModelChange)="setCustom($event)"/>
}

@if (closeText(); as text) {
  <p class="close-text" [class.text-error]="inThePast()">
    {{ text }}{{ inThePast() ? '. Giờ này đã qua, hãy chọn giờ khác.' : '' }}
  </p>
} @else if (preset() === 'none') {
  <p class="close-text muted">Bài mở cho đến khi bạn bấm đóng.</p>
}
