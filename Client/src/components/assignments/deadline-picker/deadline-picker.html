<nz-radio-group (ngModelChange)="setPreset($event)" [ngModel]="preset()" class="presets" nzButtonStyle="solid">
  <label nz-radio-button nzValue="none">Không hẹn giờ</label>
  <label nz-radio-button nzValue="45m">Sau 45 phút</label>
  <label nz-radio-button nzValue="today">Hết hôm nay</label>
  <label nz-radio-button nzValue="custom">Chọn giờ…</label>
</nz-radio-group>

@if (preset() === 'custom') {
  <nz-date-picker (ngModelChange)="setCustom($event)" [ngModel]="customDate()" [nzAllowClear]="false"
                  [nzDisabledDate]="disabledDate" [nzDisabledTime]="disabledTime" [nzShowNow]="false"
                  [nzShowTime]="{nzFormat: 'HH:mm'}" [attr.aria-label]="'assignments.deadline.pickerLabel' | msg" class="custom-time"
                  nzFormat="HH:mm dd/MM/yyyy" [nzPlaceHolder]="'assignments.deadline.pickerPlaceholder' | msg"/>
}

@if (closeText(); as text) {
  <p [class.text-error]="inThePast()" class="close-text">
    {{ text }}{{ inThePast() ? ' ' + ('assignments.deadline.inThePast' | msg) : '' }}
  </p>
}
