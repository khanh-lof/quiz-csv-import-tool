<div class="share">
  <nz-qrcode [nzSize]="qrSize()" [nzValue]="url()" class="qr" nzType="svg"/>
  <div class="details">
    <p class="code">{{ 'assignments.share.codeLabel' | msg }} <span class="code-text">{{ code() }}</span></p>
    <div class="link-row">
      <input #linkInput (focus)="selectLink()" [value]="url()" [attr.aria-label]="'assignments.share.linkLabel' | msg" class="link" nz-input readonly/>
      <button (click)="copy()" nz-button nzType="primary" type="button">
        <nz-icon nzTheme="outline" nzType="copy"/>
        {{ 'assignments.action.copyLink' | msg }}
      </button>
    </div>
  </div>
</div>
