<button nz-button nzType="default" nzSize="small" type="button" [attr.aria-pressed]="paused()"
        [attr.aria-label]="compact() ? label() : null" [attr.title]="compact() ? label() : null" (click)="toggle()">
  <nz-icon [nzType]="paused() ? 'play-circle' : 'pause-circle'" nzTheme="outline"/>
  @if (!compact()) {
    <span>{{ label() }}</span>
  }
</button>
