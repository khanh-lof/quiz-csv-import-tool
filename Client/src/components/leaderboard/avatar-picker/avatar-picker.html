<div [attr.aria-label]="'play.avatar.label' | msg" class="grid" role="radiogroup">
  @for (avatar of avatars; track avatar.id; let i = $index) {
    <button #cell (click)="select(avatar.id)" (keydown)="onKeydown($event, i)" [attr.aria-checked]="avatar.id === value()" [attr.aria-label]="avatar.nameKey | msg"
            [class.is-selected]="avatar.id === value()" [tabindex]="avatar.id === tabbable() ? 0 : -1"
            class="cell" role="radio" type="button">
      <kt-quiz-player-avatar [avatar]="avatar.id" [name]="avatar.nameKey | msg" size="md"/>
      @if (avatar.id === value()) {
        <span aria-hidden="true" class="check">✓</span>
      }
    </button>
  }
</div>
<div class="actions">
  <button (click)="random()" nz-button nzSize="small" nzType="default" type="button">🎲 {{ 'play.avatar.random' | msg }}</button>
</div>
