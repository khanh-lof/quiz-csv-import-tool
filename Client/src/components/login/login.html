<div class="qt-centered-page">
  <div class="login-card">
    <nz-card nzTitle="Đăng nhập Quiz Tool">
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div nz-row [nzGutter]="16">
          <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24">
            <nz-form-item>
              <nz-form-control [nzErrorTip]="'Nhập tên đăng nhập nhé'">
                <label [for]="'username'">Tên đăng nhập</label>
                <input
                  nz-input
                  formControlName="username"
                  placeholder="Nhập tên đăng nhập"
                  id="username"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24">
            <nz-form-item>
              <nz-form-control [nzErrorTip]="'Nhập mật khẩu nhé'">
                <label [for]="'password'">Mật khẩu</label>
                <nz-input-password>
                  <input nz-input formControlName="password"
                         placeholder="Nhập mật khẩu"
                         id="password"/>
                </nz-input-password>
              </nz-form-control>
            </nz-form-item>
          </div>

          <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24">
            <label nz-checkbox [(ngModel)]="rememberMe" [ngModelOptions]="{standalone: true}">
              Ghi nhớ tên đăng nhập
            </label>
          </div>

          <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24">
            <button
              nz-button
              nzType="primary"
              nzSize="large"
              nzBlock
              [disabled]="loginForm.invalid || isLoading"
              [nzLoading]="isLoading"
              type="submit"
            >
              Đăng nhập
            </button>
          </div>

          <!-- Everything but AI generation works without an account, so let the user go back. -->
          <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24" class="back-link">
            <a routerLink="/quiz">← Quay lại, dùng không cần đăng nhập</a>
          </div>
        </div>
      </form>
    </nz-card>
  </div>
</div>
