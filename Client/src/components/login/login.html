<div class="qt-centered-page">
  <div class="login-card">
    <nz-card nzTitle="Đăng nhập QuizTool">
      <form (ngSubmit)="onLogin()" [formGroup]="loginForm">
        <div [nzGutter]="16" nz-row>
          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" nz-col>
            <nz-form-item>
              <nz-form-control [nzErrorTip]="'Chưa nhập tên đăng nhập'">
                <label [for]="'username'">Tên đăng nhập</label>
                <input
                  formControlName="username"
                  id="username"
                  nz-input
                  placeholder="Nhập tên đăng nhập"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" nz-col>
            <nz-form-item>
              <nz-form-control [nzErrorTip]="'Chưa nhập mật khẩu'">
                <label [for]="'password'">Mật khẩu</label>
                <nz-input-password>
                  <input formControlName="password" id="password"
                         nz-input
                         placeholder="Nhập mật khẩu"/>
                </nz-input-password>
              </nz-form-control>
            </nz-form-item>
          </div>

          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" nz-col>
            <label [(ngModel)]="rememberMe" [ngModelOptions]="{standalone: true}" nz-checkbox>
              Ghi nhớ tên đăng nhập
            </label>
          </div>

          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" nz-col>
            <button
              [disabled]="loginForm.invalid || isLoading"
              [nzLoading]="isLoading"
              nz-button
              nzBlock
              nzSize="large"
              nzType="primary"
              type="submit"
            >
              Đăng nhập
            </button>
          </div>

          <!-- Everything but AI generation works without an account, so let the user go back. -->
          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" class="back-link" nz-col>
            <a routerLink="/quiz">← Quay lại, dùng không cần đăng nhập</a>
          </div>
        </div>
      </form>
    </nz-card>
  </div>
</div>
