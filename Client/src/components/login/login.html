<div class="qt-centered-page">
  <div class="login-card">
    <nz-card>
      <header class="login-head">
        <img alt="QuizTool" class="login-logo" src="logo.ico"/>
        <h1 class="login-title">{{ 'app.login.title' | msg }}</h1>
      </header>
      <form (ngSubmit)="onLogin()" [formGroup]="loginForm">
        <div [nzGutter]="16" nz-row>
          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" nz-col>
            <nz-form-item>
              <nz-form-control [nzErrorTip]="'app.login.usernameRequired' | msg">
                <label [for]="'username'">{{ 'app.login.username' | msg }}</label>
                <input
                  formControlName="username"
                  id="username"
                  nz-input
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" nz-col>
            <nz-form-item>
              <nz-form-control [nzErrorTip]="'app.login.passwordRequired' | msg">
                <label [for]="'password'">{{ 'app.login.password' | msg }}</label>
                <nz-input-password>
                  <input formControlName="password" id="password"
                         nz-input/>
                </nz-input-password>
              </nz-form-control>
            </nz-form-item>
          </div>

          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" nz-col>
            <label [(ngModel)]="rememberMe" [ngModelOptions]="{standalone: true}" nz-checkbox>
              {{ 'app.login.rememberUsername' | msg }}
            </label>
          </div>

          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" nz-col>
            <button
              [disabled]="loginForm.invalid || isLoading"
              [nzLoading]="isLoading"
              nz-button
              nzBlock
              nzSize="large"
              nzType="primary"
              type="submit"
            >
              {{ 'app.login.submit' | msg }}
            </button>
          </div>

          <!-- Everything but AI generation works without an account, so let the user go back. -->
          <div [nzLg]="24" [nzMd]="24" [nzSm]="24" [nzXs]="24" class="back-link" nz-col>
            <a class="skip-login" routerLink="/quiz">
              <nz-icon nzTheme="outline" nzType="arrow-left"/>
              {{ 'app.login.skip' | msg }}
            </a>
          </div>
        </div>
      </form>
    </nz-card>
  </div>
</div>
