<button (click)="isOpen.set(true)" class="guide-button" nz-button type="button">
  <nz-icon nzTheme="outline" nzType="question-circle"/>
  {{ 'app.usageGuide.title' | msg }}
</button>
<nz-modal (nzOnCancel)="isOpen.set(false)" (nzVisibleChange)="isOpen.set($event)" [nzFooter]="null"
          [nzVisible]="isOpen()" [nzWidth]="640" [nzTitle]="'app.usageGuide.title' | msg">
  <ng-container *nzModalContent>
    <div class="usage-guide">
      <ng-content/>
    </div>
  </ng-container>
</nz-modal>
