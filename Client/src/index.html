<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>QuizTool</title>
  <base href="/">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="logo.ico" rel="icon" type="image/x-icon">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap&subset=vietnamese"
    rel="stylesheet">
  <style>
  /* Inline, so the loader is styled before the app's stylesheet arrives. The colours mirror styles.css. */
  #app-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #ffe0f0 0%, #e0ecff 100%);
  }

  .app-loader-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .app-loader-logo {
    width: 96px;
    height: 96px;
    object-fit: cover;
  }

  #spinner {
    color: #2f2a3d;
    font-family: 'Bricolage Grotesque', 'Be Vietnam Pro', 'Segoe UI', sans-serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  #spinner:before {
    content: "Chờ xíu ngaa...";
  }

  /* A highlighter stroke running under the text, the primary button's gradient. */
  .app-loader-bar {
    width: 160px;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #ff8ecb, #8fb0ff) 0 0 / 40% 100% no-repeat, rgba(255, 142, 203, 0.2);
    animation: app-loader-sweep 1.2s ease-in-out infinite alternate;
  }

  @keyframes app-loader-sweep {
    to {
      background-position: 100% 0, 0 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .app-loader-bar {
      animation: none;
    }
  }
  </style>
</head>
<body>
<div id="app-loader">
  <div class="app-loader-body">
    <img alt="" class="app-loader-logo" src="logo.ico"/>
    <div id="spinner"></div>
    <div aria-hidden="true" class="app-loader-bar"></div>
  </div>
</div>
<kt-quiz-root></kt-quiz-root>
</body>
</html>
