# Render Blueprint: the High intelligence AI server (Server/cmd/ai-server), free. Everything else, the client
# included, runs on Vercel (vercel.json), whose Go server forwards the creative jobs at High intelligence here
# (HIGH_INTELLIGENCE_SERVER_URL, set in the Vercel project to this service's URL). Both servers use the same
# MongoDB and must share JWT_SECRET and the AI rate-limit settings.
services:
  - type: web
    name: kt-quiz-ai-tool-api
    runtime: go
    region: singapore
    # Must stay set: a web service without a plan is created on a paid one. A free instance sleeps after
    # 15 minutes without requests and takes about a minute to wake; it keeps itself awake while a job runs.
    plan: free
    rootDir: Server
    buildCommand: go build -trimpath -ldflags="-s -w" -o bin/ai-server ./cmd/ai-server
    startCommand: ./bin/ai-server
    healthCheckPath: /healthz
    # On a deploy the old instance gets SIGTERM and finishes the AI jobs it is running before it stops.
    maxShutdownDelaySeconds: 300
    buildFilter:
      paths:
        - Server/**
    envVars:
      # The values the Vercel project has, so both servers read the same jobs and users and accept the same logins.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_INTELLIGENCE_MODELS
        sync: false
