# Render Blueprint: the SPA as a static site, the Go API as a web service, and the PostgreSQL database.
# The static site rewrites /api/* to the API, so the browser sees one origin: no CORS, and the SameSite=Strict
# refresh cookie works. Its two rewrite rules name the API's public URL, which stays out of this public repo:
# they are added by hand under the static site's Redirects/Rewrites in the dashboard, in this order:
#   1. Rewrite  /api/*  ->  <API URL>/api/*
#   2. Rewrite  /*      ->  /index.html
# A Blueprint sync keeps routing rules this file does not list.
services:
  - type: web
    name: kt-quiz-ai-tool
    runtime: static
    buildCommand: cd Client && npm ci && npm run build
    staticPublishPath: Client/dist/quiz-tool/browser
    buildFilter:
      paths:
        - Client/**

  - type: web
    name: kt-quiz-ai-tool-api
    runtime: go
    region: singapore
    plan: starter
    # No rootDir: the build packs ../Extension into the binary (go generate), which must be in reach.
    buildCommand: cd Server && go generate ./internal/extension && go build -trimpath -ldflags="-s -w" -o bin/server ./cmd/server
    startCommand: cd Server && ./bin/server
    healthCheckPath: /healthz
    # On a deploy the old instance gets SIGTERM and finishes the AI jobs it is running before it stops.
    maxShutdownDelaySeconds: 300
    buildFilter:
      paths:
        - Server/**
        - Extension/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kt-quiz-db
          property: connectionString
      # The static site's URL, which the downloadable extension runs on; read when the build packs it.
      - key: APP_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_INTELLIGENCE_MODELS
        sync: false

databases:
  - name: kt-quiz-db
    databaseName: quiz
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
