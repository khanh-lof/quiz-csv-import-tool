# Local stack: PostgreSQL plus the API on http://localhost:7071.
#   docker compose up --build        (or: podman compose up --build)
# Settings other than the database URL come from .env (copy .env.example).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      PORT: "7071"
      DATABASE_URL: postgres://quiz:quiz@postgres:5432/quiz?sslmode=disable
    ports:
      - "7071:7071"
    depends_on:
      - postgres

volumes:
  postgres-data:
