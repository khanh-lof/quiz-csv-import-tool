{{define "content"}}
{{with .Data}}
<div class="page-head">
  <h1>Assignments</h1>
  <form class="filters" method="get">
    <input type="search" name="q" value="{{.Filter.Q}}" placeholder="Title, class, code or id" aria-label="Search">
    <select name="user" aria-label="Teacher">
      <option value="">Every teacher</option>
      {{range .Users}}<option {{if eq . $.Data.Filter.User}}selected{{end}}>{{.}}</option>{{end}}
    </select>
    <select name="state" aria-label="State">
      <option value="">Open or closed</option>
      <option value="open" {{if eq .Filter.State "open"}}selected{{end}}>Open</option>
      <option value="closed" {{if eq .Filter.State "closed"}}selected{{end}}>Closed</option>
    </select>
    <button>Filter</button>
    {{if or .Filter.Q .Filter.User .Filter.State}}<a href="/assignments">Clear</a>{{end}}
  </form>
</div>
<div data-live id="assignments-live">
  {{template "pager" .Pager}}
  {{template "assignmentRows" .Assignments}}
  {{if gt .Pager.Pages 1}}{{template "pager" .Pager}}{{end}}
</div>
{{end}}
{{end}}
